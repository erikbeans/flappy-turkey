<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2e1a47">
  <title>Flappy Turkey 🦃</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="wrap">
    <canvas id="game" role="button" tabindex="0" aria-label="Flappy Turkey game area — tap or click anywhere to flap"></canvas>
    <div id="mode-picker" class="hidden" role="group" aria-label="Choose game mode">
      <button type="button" id="pick-calvin" class="active">🦃<span>Calvin Mode</span></button>
      <button type="button" id="pick-sonya">🌈<span>Sonya Mode</span></button>
    </div>
    <button id="board-btn" aria-label="Open leaderboard" title="Leaderboard">🏆</button>
    <div id="board" class="hidden" role="dialog" aria-label="Leaderboard">
      <div class="board-panel">
        <div class="board-head">
          <h2>🏆 Leaderboard</h2>
          <button id="board-close" aria-label="Close leaderboard">✕</button>
        </div>
        <div id="board-tabs" role="tablist" aria-label="Leaderboard by mode">
          <button type="button" data-mode="calvin" class="active">🦃 Calvin</button>
          <button type="button" data-mode="sonya" id="tab-sonya">🌈 Sonya</button>
        </div>
        <div id="board-score" class="board-score"></div>
        <div id="board-status" class="board-status"></div>
        <ol id="board-list"></ol>
        <form id="board-form">
          <input id="board-name" maxlength="16" placeholder="Your name" autocomplete="off" enterkeyhint="done">
          <button id="board-submit" type="submit">Submit</button>
        </form>
        <div id="board-msg" role="status"></div>
        <button id="board-again" type="button">▶ Play again</button>
        <div id="board-stats" class="board-stats" title="Cumulative stats reported by all players"></div>
      </div>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="leaderboard.js"></script>
  <script src="game.js"></script>
</body>
</html>
